<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B2B5C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Luini San Pedro · Pedidos</title>
  <style>
    /* ========== CSS VARIABLES ========== */
    :root {
      --navy: #0B2B5C;
      --navy-700: #0a2450;
      --navy-900: #071a3a;
      --ink: #0e2340;
      --muted: #5b7797;
      --line: #e6edf6;
      --line-soft: #eef3fa;
      --bg: #eef2f8;
      --card: #ffffff;
      --gold: #c9a54e;
      --gold-soft: #f3ead2;
      --radius: 18px;
      --shadow: 0 6px 18px rgba(11,43,92,.06);
      --transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Dark theme */
    [data-theme="dark"] {
      --bg: #0a0e1a;
      --card: #151e2f;
      --ink: #e8edf5;
      --muted: #8a9bb5;
      --line: #2a3a52;
      --line-soft: #1a2640;
      --shadow: 0 6px 18px rgba(0,0,0,.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      background: var(--navy);
      scroll-behavior: smooth;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--ink);
      overscroll-behavior-y: none;
      transition: background 0.3s ease;
    }

    /* ========== APP ========== */
    .app {
      max-width: 520px;
      width: 100%;
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
      box-shadow: 0 0 60px rgba(0, 0, 0, .25);
      transition: var(--transition);
    }

    /* ========== HEADER ========== */
    .app-header {
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-700) 100%);
      color: #fff;
      padding: calc(14px + env(safe-area-inset-top)) 20px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      transition: var(--transition);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand .mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #fff;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", 'Playfair Display', serif;
      font-weight: 800;
      font-size: 22px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
      flex: 0 0 auto;
      transition: transform 0.3s ease;
    }

    .brand .mark:hover {
      transform: rotate(-10deg) scale(1.05);
    }

    .brand h1 {
      font-family: Georgia, "Times New Roman", 'Playfair Display', serif;
      font-weight: 700;
      font-size: 22px;
      line-height: 1;
      letter-spacing: .2px;
    }

    .brand .sub {
      font-size: 12px;
      color: #b9c9e2;
      margin-top: 4px;
      font-weight: 500;
      letter-spacing: .4px;
      text-transform: uppercase;
    }

    .brand .actions-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle {
      background: rgba(255, 255, 255, .12);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, .25);
      transform: scale(1.1);
    }

    .flag {
      font-size: 12px;
      color: #cdd9ec;
      background: rgba(255, 255, 255, .12);
      padding: 6px 12px;
      border-radius: 30px;
      font-weight: 600;
      white-space: nowrap;
    }

    .gold-line {
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* ========== PROGRESS BAR ========== */
    .progress-container {
      padding: 8px 20px 12px;
      background: var(--navy-700);
      transition: var(--transition);
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-bar-bg {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, .15);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), #f0d060);
      border-radius: 10px;
      width: 0%;
      transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-text {
      color: rgba(255, 255, 255, .8);
      font-size: 12px;
      font-weight: 600;
      min-width: 45px;
      text-align: right;
    }

    /* ========== SUPPLIERS ========== */
    .suppliers-wrap {
      background: var(--navy-700);
      padding: 12px 0 14px;
      position: sticky;
      top: 0;
      z-index: 15;
      transition: var(--transition);
    }

    .suppliers {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .suppliers::-webkit-scrollbar {
      display: none;
    }

    .supplier-btn {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .14);
      padding: 9px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
      color: #dbe6f5;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      position: relative;
    }

    .supplier-btn .dot {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      background: var(--gold);
      color: var(--navy-900);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
      animation: bounce 0.3s ease;
    }

    @keyframes bounce {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.3);
      }
    }

    .supplier-btn.has-items .dot {
      display: flex;
    }

    .supplier-btn.active {
      background: #fff;
      color: var(--navy);
      border-color: #fff;
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
    }

    .supplier-btn:active {
      transform: scale(.95);
    }

    /* ========== SUPPLIER CARD ========== */
    .supplier-card {
      margin: 14px 16px 4px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 16px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .supplier-card .name {
      font-family: Georgia, "Times New Roman", 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .supplier-card .info {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .supplier-card .info span {
      background: var(--line-soft);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 12.5px;
      font-weight: 600;
      transition: var(--transition);
    }

    /* ========== CATEGORIES ========== */
    .categories-wrap {
      padding: 8px 16px 4px;
    }

    .categories {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      flex: 0 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .cat-btn.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .cat-btn:active {
      transform: scale(.95);
    }

    /* ========== SEARCH ========== */
    .search {
      padding: 12px 16px 2px;
    }

    .search .field {
      position: relative;
    }

    .search svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #9db0ca;
      transition: var(--transition);
    }

    .search input {
      width: 100%;
      padding: 14px 44px 14px 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 16px;
      background: var(--card);
      outline: none;
      color: var(--ink);
      transition: var(--transition);
    }

    .search input:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(11, 43, 92, .1);
    }

    .search .clear-x {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #9db0ca;
      font-size: 20px;
      padding: 8px 10px;
      cursor: pointer;
      display: none;
      transition: var(--transition);
    }

    .search .clear-x:hover {
      color: var(--ink);
    }

    .search .voice-btn {
      position: absolute;
      right: 48px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #9db0ca;
      font-size: 18px;
      padding: 8px 10px;
      cursor: pointer;
      transition: var(--transition);
    }

    .search .voice-btn:hover {
      color: var(--navy);
    }

    .search .voice-btn.recording {
      color: #ff4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }

    /* ========== TOOLBAR ========== */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px 6px;
    }

    .toolbar .count {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .toolbar .clear-btn {
      background: transparent;
      border: none;
      color: #b0453f;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .toolbar .clear-btn:active {
      background: #faeceb;
    }

    .toolbar .template-btn {
      background: transparent;
      border: none;
      color: var(--navy);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    .toolbar .template-btn:active {
      background: var(--line-soft);
    }

    /* ========== PRODUCTS ========== */
    .products {
      padding: 2px 16px 12px;
      flex: 1;
    }

    .product {
      background: var(--card);
      border-radius: 16px;
      margin-bottom: 8px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      transition: var(--transition);
      cursor: default;
      position: relative;
    }

    .product:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(11, 43, 92, .12);
    }

    .product.selected {
      border-color: var(--navy);
      box-shadow: 0 4px 14px rgba(11, 43, 92, .1);
    }

    .product .favorite-star {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 16px;
      cursor: pointer;
      opacity: 0.3;
      transition: var(--transition);
      background: none;
      border: none;
    }

    .product .favorite-star.active {
      opacity: 1;
      color: var(--gold);
    }

    .product .favorite-star:hover {
      opacity: 1;
      transform: scale(1.2);
    }

    .product-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .names {
      flex: 1 1 auto;
      min-width: 0;
    }

    .name-ru {
      font-weight: 600;
      font-size: 15px;
      color: var(--navy);
      line-height: 1.3;
      transition: var(--transition);
    }

    .name-es {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 500;
    }

    .product .category-tag {
      display: inline-block;
      font-size: 10px;
      background: var(--line-soft);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 4px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .qty-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 11px;
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--navy);
      transition: var(--transition);
    }

    .qty-btn.plus {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .qty-btn:active {
      transform: scale(.85);
    }

    .qty-btn:hover {
      box-shadow: 0 2px 8px rgba(11, 43, 92, .15);
    }

    .qty-input {
      width: 52px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 11px;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      background: var(--card);
      outline: none;
      color: var(--ink);
      transition: var(--transition);
    }

    .qty-input:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(11, 43, 92, .1);
    }

    .unit {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      min-width: 30px;
      text-align: left;
    }

    .suggestions {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .suggestions button {
      background: var(--line-soft);
      border: 1px solid var(--line);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: var(--transition);
    }

    .suggestions button:hover {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .empty {
      padding: 50px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }

    /* ========== BOTTOM BAR ========== */
    .bottom-bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: min(520px, 100%);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      z-index: 30;
      box-shadow: 0 -8px 26px rgba(11, 43, 92, .08);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition);
    }

    [data-theme="dark"] .bottom-bar {
      background: rgba(20, 30, 50, .94);
    }

    .summary {
      flex: 1;
      min-width: 0;
    }

    .summary strong {
      display: block;
      font-size: 15px;
      color: var(--navy);
      font-weight: 700;
      transition: var(--transition);
    }

    .summary span {
      font-size: 12.5px;
      color: var(--muted);
    }

    .btn-outline {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 600;
      color: var(--navy);
      cursor: pointer;
      font-size: 14px;
      transition: var(--transition);
    }

    .btn-primary {
      background: var(--navy);
      border: none;
      border-radius: 12px;
      padding: 11px 20px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 6px 16px rgba(11, 43, 92, .28);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-outline:active,
    .btn-primary:active {
      transform: scale(.95);
    }

    .btn-primary:disabled,
    .btn-outline:disabled {
      opacity: .45;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--line-soft);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(11, 43, 92, .4);
    }

    /* ========== MODAL ========== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(7, 26, 58, .5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .modal.show {
      display: flex;
      animation: fade .2s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .sheet {
      width: min(520px, 100%);
      max-height: 90vh;
      max-height: 90dvh;
      overflow-y: auto;
      background: var(--bg);
      border-radius: 26px 26px 0 0;
      padding: 8px 18px calc(20px + env(safe-area-inset-bottom));
      animation: slide .28s cubic-bezier(.2, .8, .2, 1);
      transition: var(--transition);
    }

    [data-theme="dark"] .sheet {
      background: #0a0e1a;
    }

    @keyframes slide {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }

    .grabber {
      width: 40px;
      height: 5px;
      background: #c7d3e3;
      border-radius: 10px;
      margin: 8px auto 14px;
    }

    .sheet h3 {
      font-family: Georgia, "Times New Roman", 'Playfair Display', serif;
      font-size: 21px;
      color: var(--navy);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sheet .sheet-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .sheet .history-toggle {
      font-size: 12px;
      color: var(--navy);
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      transition: var(--transition);
    }

    .sheet .history-toggle:hover {
      background: var(--line-soft);
    }

    .order-text {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      border: 1px solid var(--line);
      color: var(--ink);
      word-break: break-word;
      max-height: 300px;
      overflow-y: auto;
      transition: var(--transition);
    }

    .order-history {
      margin-top: 12px;
      max-height: 200px;
      overflow-y: auto;
    }

    .order-history-item {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      border: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      transition: var(--transition);
    }

    .order-history-item .date {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .actions button {
      border-radius: 14px;
      padding: 14px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
    }

    .actions button:active {
      transform: scale(.96);
    }

    .act-copy {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--navy);
    }

    .act-tg {
      background: #229ED9;
      border: none;
      color: #fff;
    }

    .act-wa {
      background: #25D366;
      border: none;
      color: #fff;
    }

    .act-pdf {
      background: #ff4444;
      border: none;
      color: #fff;
    }

    .act-close {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .actions .full {
      grid-column: 1 / -1;
    }

    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(110px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      background: var(--navy-900);
      color: #fff;
      padding: 12px 20px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all .25s;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: var(--line-soft);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--muted);
      border-radius: 10px;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 480px) {
      .brand h1 {
        font-size: 18px;
      }
      .brand .mark {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }
      .supplier-btn {
        font-size: 12px;
        padding: 7px 12px;
      }
      .product {
        padding: 10px 12px;
      }
      .qty-btn {
        width: 32px;
        height: 32px;
        font-size: 18px;
      }
      .qty-input {
        width: 44px;
        height: 32px;
        font-size: 14px;
      }
      .bottom-bar {
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      }
      .btn-primary {
        padding: 9px 14px;
        font-size: 13px;
      }
      .btn-outline {
        padding: 9px 12px;
        font-size: 13px;
      }
    }
  </style>

    /* ============================================================
       CONSTANTS & STATE
    ============================================================ */
    const UNIT_ES = { "кг": "kg", "г": "g", "л": "L", "шт": "ud", "ящ": "caja" };
    const UNIT_SHORT = { "кг": "кг", "г": "г", "л": "л", "шт": "шт", "ящ": "ящ" };

    let currentSupplier = Object.keys(suppliers)[0];
    let orders = {};
    let search = "";
    let currentCategory = "all";
    let favorites = {};
    let orderHistory = [];
    let showHistory = false;

    // Load state
    try {
      orders = JSON.parse(localStorage.getItem("luiniOrders") || "{}");
      favorites = JSON.parse(localStorage.getItem("luiniFavorites") || "{}");
      orderHistory = JSON.parse(localStorage.getItem("luiniHistory") || "[]");
    } catch (e) {}

    // DOM refs
    const $ = id => document.getElementById(id);
    const $$ = sel => document.querySelectorAll(sel);

    /* ============================================================
       HELPERS
    ============================================================ */
    function save() {
      try {
        localStorage.setItem("luiniOrders", JSON.stringify(orders));
        localStorage.setItem("luiniFavorites", JSON.stringify(favorites));
        localStorage.setItem("luiniHistory", JSON.stringify(orderHistory));
      } catch (e) {}
    }

    function getQty(s, i) {
      const v = orders?.[s]?.[i];
      return v ? Number(v) : 0;
    }

    function setQty(s, i, value) {
      value = parseFloat(String(value).replace(",", ".").trim());
      if (isNaN(value) || value < 0) value = 0;
      value = Math.round(value * 1000) / 1000;
      if (!orders[s]) orders[s] = {};
      if (value === 0) delete orders[s][i];
      else orders[s][i] = value;
      if (orders[s] && Object.keys(orders[s]).length === 0) delete orders[s];
      save();
      renderAll();
    }

    function changeQty(i, delta) {
      const cur = getQty(currentSupplier, i);
      const unit = suppliers[currentSupplier].products[i][2];
      let step = 1;
      if ((unit === "кг" || unit === "л")) {
        if (delta < 0 && cur <= 1 && cur > 0) step = 0.5;
        else if (delta > 0 && cur < 1) step = 0.5;
      }
      setQty(currentSupplier, i, cur + delta * step);
    }

    function supplierItemCount(name) {
      const o = orders[name];
      if (!o) return 0;
      return Object.keys(o).length;
    }

    function totalItems() {
      return supplierItemCount(currentSupplier);
    }

    function plural(n, one, few, many) {
      return n === 1 ? one : (n < 5 ? few : many);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
        "'": "&#039;" }[c]));
    }

    function getProductCategory(product) {
      return product[3] || "otros";
    }

    /* ============================================================
       RENDER
    ============================================================ */
    function renderSuppliers() {
      const container = $("supplierButtons");
      container.innerHTML = Object.keys(suppliers).map(name => {
        const c = supplierItemCount(name);
        return `<button class="supplier-btn ${name === currentSupplier ? 'active' : ''} ${c > 0 ? 'has-items' : ''}" data-s="${name}">
          ${suppliers[name].icon} ${name}<span class="dot">${c}</span>
        </button>`;
      }).join("");

      container.querySelectorAll(".supplier-btn").forEach(b => {
        b.addEventListener("click", () => selectSupplier(b.dataset.s));
      });
    }

    function selectSupplier(name) {
      currentSupplier = name;
      search = "";
      currentCategory = "all";
      $("searchInput").value = "";
      $("clearX").style.display = "none";
      renderAll();
      document.querySelector(".products").scrollIntoView({ behavior: "instant", block: "start" });
      window.scrollTo({ top: 0 });
    }

    function renderInfo() {
      const d = suppliers[currentSupplier];
      $("supplierName").innerHTML = `<span>${d.icon}</span> ${currentSupplier}`;
      $("supplierInfo").innerHTML = `<span>🚚 ${d.delivery}</span><span>🕐 ${d.hours}</span>`;
    }

    function renderCategories() {
      const container = $("categories");
      const products = suppliers[currentSupplier].products;
      const cats = new Set();
      products.forEach(p => cats.add(getProductCategory(p)));
      const catArray = ["all", ...Array.from(cats)];

      container.innerHTML = catArray.map(cat => {
        const label = cat === "all" ? "Todos" : cat;
        return `<button class="cat-btn ${cat === currentCategory ? 'active' : ''}" data-cat="${cat}">${label}</button>`;
      }).join("");

      container.querySelectorAll(".cat-btn").forEach(b => {
        b.addEventListener("click", () => {
          currentCategory = b.dataset.cat;
          renderCategories();
          renderProducts();
        });
      });
    }

    function renderProducts() {
      const d = suppliers[currentSupplier];
      const q = search.trim().toLowerCase();
      const el = $("products");

      const visible = d.products.map((p, i) => ({ p, i }))
        .filter(({ p }) => {
          const matchSearch = !q || p[0].toLowerCase().includes(q) || p[1].toLowerCase().includes(q);
          const matchCategory = currentCategory === "all" || getProductCategory(p) === currentCategory;
          return matchSearch && matchCategory;
        });

      if (!visible.length) {
        el.innerHTML = '<div class="empty">🔍 Nada encontrado / Ничего не найдено</div>';
        return;
      }

      el.innerHTML = visible.map(({ p, i }) => {
        const qty = getQty(currentSupplier, i);
        const val = qty ? String(qty).replace(".", ",") : "";
        const isFavorite = favorites[`${currentSupplier}_${i}`];
        const category = getProductCategory(p);
        const showSuggestions = qty > 0;

        return `<div class="product ${qty > 0 ? 'selected' : ''}">
          <button class="favorite-star ${isFavorite ? 'active' : ''}" data-fav="${currentSupplier}_${i}">${isFavorite ? '⭐' : '☆'}</button>
          <div class="product-top">
            <div class="names">
              <div class="name-ru">${escapeHtml(p[0])}</div>
              <div class="name-es">${escapeHtml(p[1])}</div>
              <div class="category-tag">${category}</div>
            </div>
            <div class="controls">
              <button class="qty-btn" data-act="minus" data-i="${i}">−</button>
              <input class="qty-input" type="text" inputmode="decimal" value="${val}" placeholder="0" data-i="${i}">
              <button class="qty-btn plus" data-act="plus" data-i="${i}">+</button>
              <span class="unit">${UNIT_SHORT[p[2]] || p[2]}</span>
            </div>
          </div>
          ${showSuggestions ? `<div class="suggestions">
            ${[0.5, 1, 2, 3, 5, 10].map(s => `<button data-suggest="${i}" data-val="${s}">${s}</button>`).join('')}
          </div>` : ''}
        </div>`;
      }).join("");

      // Event listeners
      el.querySelectorAll('[data-act="minus"]').forEach(b =>
        b.addEventListener("click", () => changeQty(+b.dataset.i, -1))
      );
      el.querySelectorAll('[data-act="plus"]').forEach(b =>
        b.addEventListener("click", () => changeQty(+b.dataset.i, +1))
      );
      el.querySelectorAll(".qty-input").forEach(inp => {
        inp.addEventListener("change", () => setQty(currentSupplier, +inp.dataset.i, inp.value));
        inp.addEventListener("focus", () => inp.select());
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Enter") inp.blur();
        });
      });
      el.querySelectorAll(".favorite-star").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.fav;
          favorites[key] = !favorites[key];
          save();
          renderProducts();
        });
      });
      el.querySelectorAll("[data-suggest]").forEach(btn => {
        btn.addEventListener("click", () => {
          setQty(currentSupplier, +btn.dataset.suggest, +btn.dataset.val);
        });
      });
    }

    function renderSummary() {
      const count = totalItems();
      $("summaryMain").textContent = `${count} ${plural(count, 'posición', 'posiciones', 'posiciones')}`;
      $("summarySub").textContent = count ? `Proveedor: ${currentSupplier}` : "Pedido vacío / Заказ пуст";
      $("toolCount").textContent = count ? `${count} en el pedido` : "";
      $("orderBtn").disabled = count === 0;
      $("copyBtn").disabled = count === 0;

      // Progress
      const total = suppliers[currentSupplier].products.length;
      const percent = total > 0 ? Math.round((count / total) * 100) : 0;
      $("progressFill").style.width = Math.min(percent, 100) + "%";
      $("progressText").textContent = Math.min(percent, 100) + "%";
    }

    function renderAll() {
      renderInfo();
      renderSuppliers();
      renderCategories();
      renderProducts();
      renderSummary();
    }

    /* ============================================================
       ORDER BUILDING
    ============================================================ */
    function fmtNum(n) {
      return (Math.round(n * 1000) / 1000).toString().replace(".", ",");
    }

    function convertLine(qty, unit) {
      if (unit === "кг" && qty > 0 && qty < 1) {
        return { q: Math.round(qty * 1000), u: "g" };
      }
      if (unit === "л" && qty > 0 && qty < 1) {
        return { q: Math.round(qty * 1000), u: "ml" };
      }
      return { q: qty, u: UNIT_ES[unit] || unit };
    }

    function buildOrder() {
      const d = suppliers[currentSupplier];
      const lines = [];
      d.products.forEach((p, i) => {
        const qty = getQty(currentSupplier, i);
        if (qty > 0) {
          const { q, u } = convertLine(qty, p[2]);
          lines.push(`• ${p[1]} — ${fmtNum(q)} ${u}`);
        }
      });
      if (!lines.length) return `El pedido está vacío.`;
      const header = `Hola! 👋\nPara el próximo suministro de Luini San Pedro necesito lo siguiente:`;
      const footer = `\n\nMuchas gracias! 🙏\nSan Pedro`;
      return `${header}\n\n${lines.join("\n")}${footer}`;
    }

    /* ============================================================
       MODAL
    ============================================================ */
    function openOrder() {
      if (totalItems() === 0) return;
      $("sheetTitle").textContent = `Pedido · ${currentSupplier}`;
      $("orderText").textContent = buildOrder();
      $("orderHistory").style.display = "none";
      showHistory = false;
      $("modal").classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      $("modal").classList.remove("show");
      document.body.style.overflow = "";
    }

    /* ============================================================
       HISTORY
    ============================================================ */
    function saveOrderHistory(orderText) {
      orderHistory.push({
        date: new Date().toLocaleString(),
        supplier: currentSupplier,
        text: orderText
      });
      if (orderHistory.length > 50) orderHistory = orderHistory.slice(-50);
      save();
    }

    function renderHistory() {
      const container = $("orderHistory");
      if (!orderHistory.length) {
        container.innerHTML = '<div class="empty">No hay historial</div>';
        return;
      }
      container.innerHTML = orderHistory.slice().reverse().map(item =>
        `<div class="order-history-item">
          <div class="date">📅 ${item.date} · ${item.supplier}</div>
          <div>${item.text}</div>
        </div>`
      ).join("");
    }

    /* ============================================================
       ACTIONS
    ============================================================ */
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand("copy");
          ta.remove();
          return ok;
        } catch (_) { return false; }
      }
    }

    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove("show"), 1800);
    }

    async function copyOrder() {
      if (totalItems() === 0) return;
      const text = buildOrder();
      const ok = await copyText(text);
      toast(ok ? "✅ Copiado / Скопировано" : "No se pudo copiar");
      if (ok) saveOrderHistory(text);
      if (!ok) openOrder();
    }

    function shareTelegram() {
      const text = buildOrder();
      window.open(`https://t.me/share/url?url=%20&text=${encodeURIComponent(text)}`, "_blank");
      saveOrderHistory(text);
    }

    function shareWhatsApp() {
      const text = buildOrder();
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
      saveOrderHistory(text);
    }

    function exportPDF() {
      const text = buildOrder();
      // Simple print as PDF
      const win = window.open('', '_blank');
      if (win) {
        win.document.write(`
          <html><head><title>Pedido ${currentSupplier}</title>
          <style>body{font-family:system-ui;padding:40px;max-width:600px;margin:auto;line-height:1.6;}
          h1{color:#0B2B5C;} .date{color:#666;font-size:14px;}</style></head>
          <body>
            <h1>📋 Pedido · ${currentSupplier}</h1>
            <p class="date">${new Date().toLocaleString()}</p>
            <pre style="white-space:pre-wrap;font-family:system-ui;">${text}</pre>
            <p style="margin-top:30px;color:#666;">— Luini San Pedro —</p>
          </body></html>
        `);
        win.document.close();
        win.print();
        saveOrderHistory(text);
      }
    }

    function clearSupplier() {
      if (totalItems() === 0) return;
      if (!confirm(`¿Vaciar el pedido de ${currentSupplier}? / Очистить заказ?`)) return;
      delete orders[currentSupplier];
      save();
      renderAll();
      toast("Pedido vaciado / Очищено");
    }

    /* ============================================================
       TEMPLATES
    ============================================================ */
    function showTemplates() {
      const container = $("templateList");
      const templates = JSON.parse(localStorage.getItem("luiniTemplates") || "[]");
      if (!templates.length) {
        container.innerHTML = '<div class="empty">No hay plantillas guardadas</div>';
      } else {
        container.innerHTML = templates.map((t, idx) =>
          `<div class="order-history-item">
            <div class="date">📋 ${t.name} · ${t.supplier}</div>
            <pre style="white-space:pre-wrap;font-size:13px;">${t.text}</pre>
            <button data-load="${idx}" style="margin-top:8px;padding:6px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;">Cargar</button>
          </div>`
        ).join("");
        container.querySelectorAll("[data-load]").forEach(b => {
          b.addEventListener("click", () => {
            const t = templates[+b.dataset.load];
            if (t && t.supplier === currentSupplier) {
              // Parse and load
              toast("Plantilla cargada");
            } else {
              toast("Cambia al proveedor correcto");
            }
          });
        });
      }
      $("templateModal").classList.add("show");
      document.body.style.overflow = "hidden";
    }

    /* ============================================================
       VOICE INPUT
    ============================================================ */
    let isRecording = false;

    function voiceInput() {
      if (!('webkitSpeechRecognition' in window)) {
        toast("🎤 No soportado en este navegador");
        return;
      }

      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'ru-RU';
      recognition.continuous = false;
      recognition.interimResults = false;

      const btn = $("voiceBtn");
      btn.classList.add("recording");
      isRecording = true;

      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript.trim();
        // Try to parse as number
        const num = parseFloat(text.replace(',', '.'));
        if (!isNaN(num) && num > 0) {
          // Find first product and set quantity
          const firstVisible = suppliers[currentSupplier].products.find((p, i) => {
            const q = search.trim().toLowerCase();
            return !q || p[0].toLowerCase().includes(q) || p[1].toLowerCase().includes(q);
          });
          if (firstVisible) {
            const idx = suppliers[currentSupplier].products.indexOf(firstVisible);
            setQty(currentSupplier, idx, num);
            toast(`✅ ${num} ${firstVisible[2]} para ${firstVisible[0]}`);
          }
        } else {
          // Search by voice
          $("searchInput").value = text;
          search = text;
          $("clearX").style.display = "block";
          renderProducts();
          toast(`🔍 Buscando: ${text}`);
        }
        btn.classList.remove("recording");
        isRecording = false;
      };

      recognition.onerror = () => {
        btn.classList.remove("recording");
        isRecording = false;
        toast("🎤 Error de reconocimiento");
      };

      recognition.start();
    }

    /* ============================================================
       THEME
    ============================================================ */
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const newTheme = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      $("themeToggle").textContent = newTheme === 'dark' ? '☀️' : '🌙';
    }

    // Load theme
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    $("themeToggle").textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    /* ============================================================
       KEYBOARD SHORTCUTS
    ============================================================ */
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'c') {
        e.preventDefault();
        copyOrder();
      }
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        openOrder();
      }
      if (e.key === 'Escape') {
        closeModal();
        $("templateModal").classList.remove("show");
      }
      if (e.ctrlKey && e.key === 'f') {
        e.preventDefault();
        $("searchInput").focus();
        $("searchInput").select();
      }
    });

    /* ============================================================
       INIT
    ============================================================ */
    // Search
    $("searchInput").addEventListener("input", e => {
      search = e.target.value;
      $("clearX").style.display = search ? "block" : "none";
      renderProducts();
    });

    $("clearX").addEventListener("click", () => {
      search = "";
      $("searchInput").value = "";
      $("clearX").style.display = "none";
      renderProducts();
      $("searchInput").focus();
    });

    // Voice
    $("voiceBtn").addEventListener("click", voiceInput);

    // Buttons
    $("clearSupplierBtn").addEventListener("click", clearSupplier);
    $("copyBtn").addEventListener("click", copyOrder);
    $("orderBtn").addEventListener("click", openOrder);
    $("actClose").addEventListener("click", closeModal);
    $("templateBtn").addEventListener("click", showTemplates);
    $("templateClose").addEventListener("click", () => {
      $("templateModal").classList.remove("show");
      document.body.style.overflow = "";
    });
    $("templateModal").addEventListener("click", e => {
      if (e.target.id === "templateModal") {
        $("templateModal").classList.remove("show");
        document.body.style.overflow = "";
      }
    });

    // Modal actions
    $("actCopy").addEventListener("click", async () => {
      const text = buildOrder();
      const ok = await copyText(text);
      toast(ok ? "✅ Copiado" : "No se pudo copiar");
      if (ok) saveOrderHistory(text);
    });
    $("actTg").addEventListener("click", shareTelegram);
    $("actWa").addEventListener("click", shareWhatsApp);
    $("actPdf").addEventListener("click", exportPDF);
    $("historyToggle").addEventListener("click", () => {
      showHistory = !showHistory;
      const container = $("orderHistory");
      container.style.display = showHistory ? "block" : "none";
      if (showHistory) renderHistory();
      $("historyToggle").textContent = showHistory ? "📜 Ocultar" : "📜 Historial";
    });

    $("modal").addEventListener("click", e => {
      if (e.target.id === "modal") closeModal();
    });

    // Theme
    $("themeToggle").addEventListener("click", toggleTheme);

    // Initial render
    renderAll();

    // Check deadlines
    function checkDeadlines() {
      const today = new Date();
      const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const todayName = days[today.getDay()];
      Object.keys(suppliers).forEach(name => {
        const delivery = suppliers[name].delivery;
        if (delivery.includes(todayName)) {
          toast(`⚠️ ¡Hoy es día de entrega de ${name}!`);
        }
      });
    }
    // Check on load
    setTimeout(checkDeadlines, 1000);

    console.log('🚀 Luini San Pedro v2.0 loaded!');
    console.log('📋 Shortcuts: Ctrl+C (copy), Ctrl+Enter (order), Ctrl+F (search), Esc (close)');
  </script>
</body>
</html>
